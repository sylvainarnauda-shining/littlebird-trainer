# Weekly maintenance (docs/PUBLIER-UNE-VERSION.md). A failed scheduled run e-mails the maintainer. Read-only token; writes nothing.
#   engine   the Chromium shipped in the desktop app is still patched: the pinned Electron major is supported and no
#            newer release of its line has been public for more than 30 days (7 days if it fixes a bug exploited in the
#            wild: read the Electron release notes)
#   audit    advisories (high and critical) and registry signatures of the locked dependency tree
#   privacy  tracked files and whole history against the private denylist (no npm in that job)
name: Maintenance

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  engine:
    name: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/check-support-window.mjs

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --audit-level=high

  privacy:
    name: privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Files and whole history, private denylist required
        env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
        run: node scripts/privacy-scan.mjs --tracked --history --strict --require-denylist
